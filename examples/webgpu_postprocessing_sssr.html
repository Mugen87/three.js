<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Stochastic Screen Space Reflections (SSSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSSR</span>
			</div>

			<small>
				Stochastic Screen Space Reflections &mdash; a simplified port of <a href="https://github.com/GPUOpen-Effects/FidelityFX-SSSR" target="_blank" rel="noopener">AMD FidelityFX SSSR</a>.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>
		</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { velocity, pass, mrt, output, normalView, metalness, roughness, screenUV, color, sample, directionToColor, colorToDirection, vec2, colorSpaceToWorking } from 'three/tsl';
		import { sssr } from 'three/addons/tsl/display/SSSRNode.js';
		import { traa } from 'three/addons/tsl/display/TRAANode.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';

		const params = {
			maxIterations: 64,
			mostDetailedMip: 0,
			maxDistance: 10,
			opacity: 1,
			thickness: 0.1,
			roughness: 0.2,
			enabled: true
		};

		let camera, scene, model, renderer, renderPipeline, sssrPass;
		let controls;

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) );

			const dracoLoader = new DRACOLoader();
			dracoLoader.setDecoderPath( 'jsm/libs/draco/' );
			dracoLoader.setDecoderConfig( { type: 'js' } );

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				model = gltf.scene;

				model.traverse( function ( object ) {

					if ( object.material ) {

						if ( object.material.name === 'Lense_Casing' ) {

							object.material.transparent = true;

						}

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;

					}

				} );

				model.position.y = 0.1;
				scene.add( model );

			} );

			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: 0.2
			} );
			const floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			//

			renderPipeline = new THREE.RenderPipeline( renderer );

			const scenePass = pass( scene, camera );
			scenePass.setMRT( mrt( {
				output: output,
				normal: directionToColor( normalView ),
				metalrough: vec2( metalness, roughness ), // pack metalness and roughness into a single attachment
				velocity: velocity
			} ) );

			const scenePassColor = scenePass.getTextureNode( 'output' ).toInspector( 'Color' );
			const scenePassNormal = scenePass.getTextureNode( 'normal' ).toInspector( 'Normal', ( node ) => {

				return colorSpaceToWorking( node, THREE.SRGBColorSpace );

			} );
			const scenePassDepth = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

				return scenePass.getLinearDepthNode();

			} );
			const scenePassMetalRough = scenePass.getTextureNode( 'metalrough' ).toInspector( 'Metalness-Roughness' );
			const scenePassVelocity = scenePass.getTextureNode( 'velocity' );

			// optional: optimize bandwidth by reducing the texture precision for normals and metal/roughness

			const normalTexture = scenePass.getTexture( 'normal' );
			normalTexture.type = THREE.UnsignedByteType;

			const metalRoughTexture = scenePass.getTexture( 'metalrough' );
			metalRoughTexture.type = THREE.UnsignedByteType;

			const sceneNormal = sample( ( uv ) => {

				return colorToDirection( scenePassNormal.sample( uv ) );

			} );

			//

			sssrPass = sssr( scenePassColor, scenePassDepth, sceneNormal, scenePassMetalRough.r, scenePassMetalRough.g ).toInspector( 'SSSR' );

			// blend SSSR over beauty (SSSR outputs premultiplied color, so use additive blending)

			const outputNode = traa( scenePassColor.add( sssrPass.rgb ), scenePassDepth, scenePassVelocity, camera );

			renderPipeline.outputNode = outputNode;

			//

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			const gui = renderer.inspector.createParameters( 'Settings' );
			const sssrFolder = gui.addFolder( 'SSSR' );
			sssrFolder.add( params, 'maxIterations', 8, 128, 1 ).onChange( updateParameters );
			sssrFolder.add( params, 'mostDetailedMip', 0, 3, 1 ).onChange( updateParameters );
			sssrFolder.add( params, 'maxDistance', 0, 20 ).onChange( updateParameters );
			sssrFolder.add( params, 'opacity', 0, 1 ).onChange( updateParameters );
			sssrFolder.add( params, 'thickness', 0, 1 ).onChange( updateParameters );
			sssrFolder.add( params, 'enabled' ).onChange( () => {

				if ( params.enabled === true ) {

					renderPipeline.outputNode = outputNode;

				} else {

					renderPipeline.outputNode = scenePass;

				}

				renderPipeline.needsUpdate = true;

			} );
			const modelFolder = gui.addFolder( 'Model' );
			modelFolder.add( params, 'roughness', 0, 1 ).onChange( ( value ) => {

				model.traverse( function ( object ) {

					if ( object.material ) {

						object.material.roughness = value;

					}

				} );

				floor.material.roughness = value;

			} );

			updateParameters();

		}

		function updateParameters() {

			sssrPass.maxIterations.value = params.maxIterations;
			sssrPass.mostDetailedMip.value = params.mostDetailedMip;
			sssrPass.maxDistance.value = params.maxDistance;
			sssrPass.opacity.value = params.opacity;
			sssrPass.thickness.value = params.thickness;

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			controls.update();

			renderPipeline.render();

		}

	</script>
</body>

</html>
